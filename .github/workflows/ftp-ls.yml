# Temporary: list FTP folders to find where public_html is. Delete after use.
name: FTP list
on: workflow_dispatch
jobs:
  ls:
    runs-on: ubuntu-latest
    steps:
      - env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          for d in "" public_html/ domains/ domains/haltriedman.com/ domains/haltriedman.com/public_html/; do
            echo "=== /$d"; curl -s --ssl --list-only --user "$U:$P" "ftp://$S/$d" || echo "(not found)"
          done
