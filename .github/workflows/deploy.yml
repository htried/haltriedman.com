# Uploads the site to Hostinger over FTP on every push to main.
# Only touches files from this repo; anything else in public_html is left alone.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: domains/haltriedman.com/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
