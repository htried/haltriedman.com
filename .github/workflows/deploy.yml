# Uploads the site to Hostinger over FTP on every push to main.
# Upload only: nothing on the server is deleted, so other folders in
# public_html are left alone. (A file removed from this repo has to be
# deleted from the server by hand.)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq lftp
      - env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow no;
            set net:max-retries 3;
            mirror --reverse --verbose \
              --exclude-glob .git* --exclude-glob .github/ --exclude-glob README.md \
              ./ domains/haltriedman.com/public_html/;
            quit"
